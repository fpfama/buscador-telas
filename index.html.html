<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ubicación de telas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap">
<style>
:root{--bg:#eef1f5;--surface:#fff;--ink:#1b2433;--muted:#5d6878;--line:#d3d9e2;--accent:#2b4c7e;--tag:#f2c14e;--tagink:#2a2108;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121821;--surface:#1c2431;--ink:#e9edf3;--muted:#9aa5b5;--line:#2f3a4b;--accent:#8fb3ea;--tag:#f2c14e;--tagink:#2a2108}}
:root[data-theme="dark"]{--bg:#121821;--surface:#1c2431;--ink:#e9edf3;--muted:#9aa5b5;--line:#2f3a4b;--accent:#8fb3ea;--tag:#f2c14e;--tagink:#2a2108}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.4 Archivo,system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:26px;font-weight:800;margin:4px 0 14px;letter-spacing:-.01em}
.search{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0 10px;z-index:5}
input[type=search]{width:100%;font:600 20px Archivo,system-ui,sans-serif;padding:16px 18px;border:2px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);outline:none}
input[type=search]:focus{border-color:var(--accent)}
.meta{color:var(--muted);font-size:14px;margin:6px 2px 0;min-height:20px}
ul{list-style:none;margin:8px 0 0;padding:0}
li{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
li .n{font-weight:600;overflow-wrap:anywhere}
.badge{flex:none;min-width:64px;text-align:center;background:var(--tag);color:var(--tagink);font-weight:800;font-size:26px;line-height:1;padding:11px 10px;border-radius:8px;border:0;cursor:pointer;font-family:inherit}
.badge:focus-visible,.chip:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
details{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
summary{cursor:pointer;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{font:600 16px Archivo,system-ui,sans-serif;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.admin p{color:var(--muted);font-size:14px;margin:10px 0}
button.act{font:600 16px Archivo,system-ui,sans-serif;padding:10px 16px;border-radius:10px;border:1px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer;margin-right:8px}
.empty{color:var(--muted);padding:24px 4px;text-align:center}
</style>
</head>
<body>
<main>
  <h1>Ubicación de telas</h1>
  <div class="search">
    <input id="q" type="search" placeholder="Escribe el nombre de la tela" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Buscar tela">
    <div class="meta" id="meta" aria-live="polite"></div>
  </div>
  <ul id="list"></ul>

  <details>
    <summary>Ver telas por ubicación</summary>
    <div class="chips" id="chips"></div>
  </details>

  <details class="admin">
    <summary>Actualizar datos</summary>
    <p>Sube el Excel nuevo (título en la columna A, ubicación en la columna B). Los datos se guardan solo en este dispositivo. Para que todos vean el cambio, envía el Excel a Claude y publica de nuevo.</p>
    <input id="file" type="file" accept=".xlsx,.xls,.csv" hidden>
    <button class="act" id="up" type="button">Cargar Excel</button>
    <button class="act" id="reset" type="button">Usar datos originales</button>
    <p id="status"></p>
  </details>
</main>

const norm = s => String(s).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
const $ = id => document.getElementById(id);
let idx = [];

function build() {
  idx = data.map(([t, u]) => ({ t, u, k: norm(t), l: norm(u) }));
  const locs = [...new Set(data.map(d => d[1]))].sort((a, b) => a.localeCompare(b, "es", { numeric: true }));
  $("chips").innerHTML = "";
  locs.forEach(l => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.textContent = l; b.setAttribute("aria-pressed", "false");
    b.onclick = () => setLoc(active === l ? null : l);
    $("chips").appendChild(b);
  });
  $("status").textContent = "Telas cargadas: " + data.length + (data === ORIGINAL ? " (datos originales, " + BUILT + ")" : " (Excel cargado en este dispositivo)");
}

function setLoc(l) {
  active = l;
  document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", String(c.textContent === l)));
  render();
}

function render() {
  const toks = norm($("q").value).split(/\s+/).filter(Boolean);
  let res = idx.filter(r => (!active || r.u === active) && toks.every(t => r.k.includes(t) || r.l === t));
  res.sort((a, b) => a.k.localeCompare(b.k, "es", { numeric: true }));
  const total = res.length, MAX = 100;
  const list = $("list"); list.innerHTML = "";
  if (!toks.length && !active) { $("meta").textContent = ""; list.innerHTML = '<div class="empty">Escribe parte del nombre, por ejemplo “sacco 66” o “lino”.</div>'; return; }
  if (!total) { $("meta").textContent = ""; list.innerHTML = '<div class="empty">No hay telas con ese nombre. Prueba con menos palabras.</div>'; return; }
  $("meta").textContent = total + (total === 1 ? " resultado" : " resultados") + (active ? " en " + active : "") + (total > MAX ? " (se muestran los primeros " + MAX + ")" : "");

    const li = document.createElement("li");
    const n = document.createElement("span"); n.className = "n"; n.textContent = r.t;
    const b = document.createElement("button"); b.type = "button"; b.className = "badge"; b.textContent = r.u;
    b.title = "Ver todas las telas en " + r.u; b.onclick = () => { setLoc(r.u); window.scrollTo(0, 0); };

  });
}

$("file").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const wb = XLSX.read(await f.arrayBuffer(), { type: "array" });
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: "" });

    rows.forEach((r, i) => {
      const t = String(r[0] || "").replace(/\s+/g, " ").trim(), u = String(r[1] || "").trim().toUpperCase();

};
